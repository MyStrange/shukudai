<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:image" content="shukudai-og.png">
<meta property="og:title" content="宿題">
<!--
  Пути черт в массиве K взяты из KanjiVG (https://kanjivg.tagaini.net/),
  лицензия Creative Commons Attribution-Share Alike 3.0.
  Указание авторства перенесено сюда из футера; то же есть в README.
-->
<title>宿題</title>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --text: #1a1a1a;
    --muted: #aaa;
    --border: #e8e8e8;
    --radius: 18px;
    --gap: 10px;
    --c1: #BEDDD5;
    --c2: #FCD0BB;
    --c3: #E1E5F3;
    --c4: #FFF0F7;
    --btn-h: 32px;
    --btn-tall: 46px;
    --btn-border: #d4d4d4;
    /* единые токены кнопок: граница, текст и два ховера —
       на белой странице темнее, на цветной карточке светлее */
    --btn-bd: rgba(0,0,0,0.12);
    --btn-fg: rgba(0,0,0,0.55);
    --btn-hover-page: rgba(0,0,0,0.045);
    --btn-hover-card: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Geologica', 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── TOPBAR ── */
  .topbar {
    padding: 22px 28px 20px;
  }

  .logo-row {
    display: flex;
    align-items: flex-end;
    margin-bottom: 18px;
  }

  .logo {
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 900;
    font-size: 2.5rem;
    color: var(--text);
    line-height: 1;
    letter-spacing: -0.02em;
    flex: 1;
  }

  /* shuffle: icon only, no border ever */
  .shuffle-btn {
    display: inline-flex;
    align-items: flex-end;
    justify-content: center;
    width: 48px;
    height: 48px;
    padding: 0 0 2px 0;
    border: none;
    background: transparent;
    cursor: pointer;
    flex-shrink: 0;
    color: var(--muted);
    margin-bottom: -6px;
  }

  /* ── CONTROLS WRAP ── */
  .controls-wrap {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: 5px;
  }

  /* filter pills row */
  .controls-row {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
    flex: 1;
  }

  /* ══════════════════════════════════════════
     КНОПКИ — одна база на все режимы.
     Геометрия, типографика, ховер и выключенное состояние живут здесь;
     варианты ниже отличаются только размером и назначением.
     ══════════════════════════════════════════ */
  .pill, .mode-btn, .spoiler-btn, .lopt, .qtile, .kmini {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    border: 1.5px solid var(--btn-bd);
    border-radius: 100px;
    background: transparent;
    color: var(--btn-fg);
    font-family: 'Geologica', 'Noto Sans JP', sans-serif;
    font-weight: 500;
    line-height: 1;
    cursor: pointer;
    transition: background 0.13s, border-color 0.13s, color 0.13s, opacity 0.13s;
  }

  /* кнопки страницы темнеют, кнопки на карточке светлеют */
  .pill:hover:not(.active),
  .mode-btn:hover:not(.active) {
    background: var(--btn-hover-page);
    color: var(--text);
  }
  .spoiler-btn:hover:not(:disabled),
  .lopt:hover:not(:disabled),
  .qtile:hover:not(:disabled),
  .kmini:hover:not(:disabled) {
    background: var(--btn-hover-card);
    color: var(--text);
  }

  .pill:disabled, .mode-btn:disabled, .spoiler-btn:disabled,
  .lopt:disabled, .qtile:disabled, .kmini:disabled {
    opacity: 0.3;
    cursor: default;
  }

  /* ── SHARED PILL STYLE ── */
  .pill {
    height: var(--btn-h);
    font-size: 0.78rem;
    white-space: nowrap;
    padding: 0 13px;
  }

  .pill.active {
    background: var(--text);
    border-color: var(--text);
    color: #fff;
  }

  .spin {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-family: sans-serif;
    font-weight: 100;
    line-height: 1;
    transform-origin: center center;
    transition: transform 0.5s ease-in-out;
  }
  .spin.spinning {
    transform: rotate(360deg);
  }
  /* ── TOPIC ROW ── */
  .topic-row {
    display: flex;
    flex-wrap: wrap;
    column-gap: 0;
    row-gap: 0;
    margin-top: 10px;
    width: 100%;
    min-height: 0;
  }
  .topic-row:empty { margin-top: 0; }

  .topic-pill {
    height: var(--btn-h);
    display: inline-flex;
    align-items: center;
    padding: 0 12px;
    border-radius: 100px;
    border: none;
    background: transparent;
    font-family: 'Geologica', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    transition: color 0.13s;
    white-space: nowrap;
    line-height: 1;
  }
  .topic-pill:hover { color: var(--text); }
  .topic-pill.active { color: var(--text); font-weight: 700; }

  /* ── GRID ── */
  .main {
    padding: var(--gap) 28px 60px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--gap);
  }

  @media (max-width: 680px) {
    .main { padding: var(--gap) 14px 60px; }
    .topbar { padding: 18px 14px 16px; }
    .grid { grid-template-columns: 1fr; }
    footer { padding: 12px 14px; }
    .topic-row { column-gap: 4px; row-gap: 0; }
  }
  @media (min-width: 681px) and (max-width: 980px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }

  /* ── CARD ── */
  .card {
    border-radius: var(--radius);
    padding: 20px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: background 0.3s ease;
    animation: up 0.28s ease backwards;
  }

  @keyframes up {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* grid rows all same height */
  .grid { align-items: stretch; }
  .grid { grid-auto-rows: 1fr; }

  .card-num {
    font-size: 0.7rem;
    font-weight: 600;
    color: rgba(0,0,0,0.25);
    line-height: 1;
    letter-spacing: 0.04em;
  }

  .sentence-ru {
    font-family: 'Geologica', sans-serif;
    font-size: 1.08rem;
    font-weight: 400;
    line-height: 1.55;
    color: var(--text);
    flex: 1;
  }

  /* ── 答え BUTTON SPOILER ── */
  .spoiler-btn {
    width: 100%;
    height: var(--btn-h);
    font-size: 0.78rem;
    letter-spacing: 0.05em;
    flex-shrink: 0;
  }

  /* answer text — hidden but takes up space to keep card height stable */
  .answer-text {
    visibility: hidden;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.97rem;
    font-weight: 400;
    line-height: 1.7;
    letter-spacing: 0.02em;
    color: var(--text);
    padding: 2px 2px 4px;
    flex-shrink: 0;
  }

  .answer-text.visible { visibility: visible; }

  /* ── ПЕРЕКЛЮЧАТЕЛЬ РЕЖИМА 文 / 字 ── */
  .mode-switch {
    display: flex;
    gap: 3px;
    align-items: center;
    flex-shrink: 0;
    margin-bottom: -6px;
    align-self: flex-end;
  }

  .mode-btn {
    height: var(--btn-h);
    min-width: 36px;
    font-size: 0.85rem;
  }
  .mode-btn.active {
    background: var(--text);
    border-color: var(--text);
    color: #fff;
  }

  /* ── КАРТОЧКА КАНДЗИ ── */
  /* верхняя строка: номер урока слева, отмена и очистка справа */
  .ktop {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .ktop .card-num { flex: 1; }

  .kactions {
    display: flex;
    gap: 4px;
    margin: -5px -3px -5px 0;
  }

  .kmini {
    width: 26px;
    height: 26px;
    padding: 0;
    font-size: 0.8rem;
  }

  .kcard-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .kmean {
    font-family: 'Geologica', sans-serif;
    font-size: 1.08rem;
    font-weight: 500;
    line-height: 1.3;
  }

  .kstrokes {
    font-family: 'Geologica', sans-serif;
    font-size: 0.68rem;
    color: rgba(0,0,0,0.3);
    margin-left: auto;
    white-space: nowrap;
    transition: color 0.15s;
  }
  .kstrokes.ok { color: #3a9d6b; font-weight: 600; }

  /* промах по черте — поле вздрагивает */
  @keyframes kshake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(3px); }
  }
  .kbox.shake { animation: kshake 0.3s ease; }

  /* поле для письма с направляющими как в прописи */
  .kbox {
    position: relative;
    flex: 1;
    min-height: 150px;
    aspect-ratio: 1 / 1;
    width: auto;
    max-width: 100%;
    align-self: center;
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    touch-action: none;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.055);
  }
  .kbox::before, .kbox::after {
    content: '';
    position: absolute;
    background: rgba(0,0,0,0.07);
    pointer-events: none;
  }
  .kbox::before { left: 50%; top: 7%; bottom: 7%; width: 1px; }
  .kbox::after  { top: 50%; left: 7%; right: 7%; height: 1px; }

  /* порядок черт поверх поля */
  .kghost {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }
  .kghost.show { opacity: 1; }
  .kghost path {
    fill: none;
    stroke: #c4c4c4;
    stroke-width: 4.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .kcanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
  }

  /* чтения и примеры — открываются по 答え */
  .kread {
    visibility: hidden;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.88rem;
    color: rgba(0,0,0,0.5);
    padding: 0 2px;
    flex-shrink: 0;
  }
  .kread.visible { visibility: visible; }

  .kwords {
    visibility: hidden;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.76rem;
    line-height: 1.65;
    color: var(--text);
    white-space: pre-line;
    padding: 0 2px;
    flex-shrink: 0;
  }
  .kwords.visible { visibility: visible; }
  /* ── РЕЖИМ ВЫБОРА КАНДЗИ ── */
  .grid.quiz {
    display: block;
    max-width: 660px;
    margin: 0 auto;
  }

  .qcard {
    border-radius: var(--radius);
    padding: 28px 22px 22px;
    text-align: center;
    animation: up 0.28s ease backwards;
    /* чтобы карточка не исчезала, когда после ответа белеет */
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
  }

  .qprompt {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 2rem;
    font-weight: 500;
    line-height: 1.35;
    letter-spacing: 0.02em;
  }
  .qprompt.sentence { font-size: 1.45rem; line-height: 1.7; }
  /* пропуск: линия рисуется бордюром, символов ＿ внутри нет */
  .qprompt .blank {
    display: inline-block;
    text-align: center;
    vertical-align: bottom;
    color: var(--text);
    border-bottom: 2px solid rgba(0,0,0,0.2);
    margin: 0 3px;
    transition: color 0.15s, border-color 0.15s;
  }
  .qprompt .blank.cur { border-bottom-color: rgba(0,0,0,0.6); }
  .qprompt .blank.right { color: #3a9d6b; border-bottom-color: #3a9d6b; }

  .qsub {
    font-family: 'Geologica', sans-serif;
    font-size: 0.92rem;
    color: rgba(0,0,0,0.42);
    margin-top: 12px;
  }
  .qsub span.cur { font-weight: 700; color: var(--text); }

  .qhint {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.84rem;
    line-height: 1.7;
    color: rgba(0,0,0,0.55);
    white-space: pre-line;
    text-align: center;
    margin-top: 10px;
    min-height: 1.4em;
  }

  .qpool {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 22px;
  }

  .qtile {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: rgba(255,255,255,0.6);
    font-size: 1.5rem;
    color: var(--text);
  }
  .qtile.wrong {
    background: #f6dedb;
    border-color: #d8a29d;
    color: #9c4a44;
    animation: kshake 0.3s ease;
  }
  .qtile.tip { border-color: rgba(0,0,0,0.35); box-shadow: 0 0 0 3px rgba(0,0,0,0.06); }

  .qstat {
    font-family: 'Geologica', sans-serif;
    font-size: 0.74rem;
    color: rgba(0,0,0,0.4);
    margin-top: 18px;
  }

  /* нижние действия карточки: всегда во всю ширину, чтобы не разъезжались */
  .qhintbtn, .qagain, .qnext { margin-top: 18px; }

  /* главная кнопка — тёмная заливка; на карточке она всегда одна */
  .qnext {
    background: var(--text) !important;
    border-color: var(--text) !important;
    color: #fff !important;
  }
  .qnext:hover:not(:disabled) { opacity: 0.85; }

  /* мнемоника на карточке прописи */
  .kmnemo {
    visibility: hidden;
    font-family: 'Geologica', sans-serif;
    font-size: 0.78rem;
    line-height: 1.5;
    color: rgba(0,0,0,0.5);
    padding: 0 2px;
    flex-shrink: 0;
  }
  .kmnemo.visible { visibility: visible; }

  /* ── РЕЖИМ 覚 ── */
  .lopts {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 22px;
  }

  .lopt {
    width: 100%;
    min-height: var(--btn-tall);
    padding: 10px 16px;
    border-radius: 14px;
    background: rgba(255,255,255,0.6);
    font-size: 1rem;
    color: var(--text);
  }
  .lopt.right {
    background: #daeee2;
    border-color: #7cb79a;
    color: #2d6a4a;
    font-weight: 600;
  }
  .lopt.wrong {
    background: #f6dedb;
    border-color: #d8a29d;
    color: #9c4a44;
    animation: kshake 0.3s ease;
  }
  .lopt:disabled { cursor: default; }
  .lopt:disabled:not(.right):not(.wrong) { opacity: 0.4; }
  .lopt.wrong:disabled { opacity: 0.75; }

  /* «назад» — кружок в левом верхнем углу карточки */
  .qcard { position: relative; }
  .lback {
    position: absolute;
    top: 14px;
    left: 14px;
    font-size: 0.9rem;
  }

  /* карточка письма внутри 覚 */
  .lactions { justify-content: flex-end; margin: 0 0 4px; }
  .lhead { justify-content: center; gap: 12px; }
  .lhead .kstrokes { margin-left: 0; }
  .lbox { margin: 16px auto 0; width: 200px; max-width: 70%; flex: none; }
  .lread { text-align: center; margin-top: 10px; }
  .qcard .kwords { text-align: center; margin-top: 6px; }
  .qcard .kmnemo { text-align: center; margin-top: 6px; }

  /* ── FOOTER ── */
  footer {
    padding: 14px 28px;
    border-top: 1px solid var(--border);
    font-size: 0.72rem;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
    font-family: 'Geologica', sans-serif;
    font-weight: 400;
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="logo-row">
    <div class="logo">宿題</div>
    <div class="mode-switch" id="modeSwitch">
      <button class="mode-btn active" data-mode="sentence" title="предложения">文</button>
      <button class="mode-btn" data-mode="kanji" title="прописи">字</button>
      <button class="mode-btn" data-mode="quiz" title="подобрать кандзи">択</button>
      <button class="mode-btn" data-mode="learn" title="заучивание с повторением">覚</button>
    </div>
    <button class="shuffle-btn" onclick="shuffle(); spinIcon(this)">
      <span class="spin">⟳</span>
    </button>
  </div>
  <div class="controls-wrap" id="controlsWrap">
    <div class="controls-row" id="controlsRow">
      <!-- pills injected here -->
    </div>
    <div class="topic-row" id="topicRow"></div>
  </div>
</header>

<main class="main">
  <div class="grid" id="grid"></div>
</main>

<footer>
  <span id="ftotal"></span>
  <span>2026</span>
</footer>

  // 会話
  {u:8,t:"会話",ru:"Такэси, давайте завтра все устроим барбекю.",jp:"たけしさん、あしたみんなでバーベキューをしませんか。"},

  {u:8,t:"会話",ru:"Сора и Роберт придут. Думаю, Мэри тоже придёт.",jp:"ソラさんとロバートさんが来ます。メアリーさんも来ると思います。"},

  {u:8,t:"普通体",ru:"Ешь рыбу? — Да, ем./Нет, не ем.",jp:"魚を食べる？　うん、食べる。／ううん、食べない。"},
  {u:8,t:"普通体",ru:"Сегодня будешь заниматься? — Да./Нет.",jp:"今日、勉強する？　うん、する。／ううん、しない。"},
  {u:8,t:"普通体",ru:"Сегодня встречаешься с друзьями? — Да./Нет.",jp:"今日、友だちに会う？　うん、会う。／ううん、会わない。"},
  {u:8,t:"普通体",ru:"Часто пьёшь чай? — Да./Нет.",jp:"よくお茶を飲む？　うん、飲む。／ううん、飲まない。"},
  {u:8,t:"普通体",ru:"Часто ездишь на поезде? — Да./Нет.",jp:"よく電車に乗る？　うん、乗る。／ううん、乗らない。"},
  {u:8,t:"普通体",ru:"Каждый день говоришь по-японски? — Да./Нет.",jp:"毎日、日本語を話す？　うん、話す。／ううん、話さない。"},
  {u:8,t:"普通体",ru:"Каждый день принимаешь ванну? — Да./Нет.",jp:"毎日、お風呂に入る？　うん、入る。／ううん、入らない。"},
  {u:8,t:"普通体",ru:"Завтра придёшь в университет? — Да./Нет.",jp:"あした、大学に来る？　うん、来る。／ううん、来ない。"},

  {u:8,t:"普通体",ru:"На следующей неделе пойдёшь в караоке? — Да./Нет.",jp:"来週、カラオケに行く？　うん、行く。／ううん、行かない。"},
  {u:8,t:"普通体",ru:"Каждую неделю убираешь комнату? — Да./Нет.",jp:"毎週、部屋を掃除する？　うん、する。／ううん、しない。"},

  {u:10,t:"で（手段）",ru:"Мы поехали туда на машине.",jp:"車で行きました。"},
  {u:10,t:"で（手段）",ru:"Я поехал на станцию на такси.",jp:"タクシーで駅まで行きました。"},
  // まとめ
  {u:10,t:"まとめ",ru:"Зимой на Хоккайдо холоднее, чем в Токио.",jp:"冬は北海道のほうが東京より寒いです。"},
  {u:10,t:"まとめ",ru:"Собираюсь поехать в путешествие на поезде.",jp:"電車で旅行するつもりです。"},
  {u:10,t:"まとめ",ru:"Дорога заняла примерно три часа.",jp:"三時間ぐらいかかりました。"},
  {u:10,t:"まとめ",ru:"Из всех времён года больше всего люблю весну, потому что теплеет.",jp:"季節の中で春がいちばん好きです。暖かくなりますから。"},
  {u:10,t:"まとめ",ru:"Денег нет, поэтому на каникулах никуда не поеду.",jp:"お金がないから、休みはどこにも行きません。"},
  {u:10,t:"まとめ",ru:"Я ещё не решил, где остановлюсь.",jp:"どこに泊まるか、まだ決めていません。"},
  {u:10,t:"まとめ",ru:"Стало поздно, поэтому поеду домой на такси.",jp:"遅くなりましたから、タクシーで帰ります。"},
  {u:10,t:"まとめ",ru:"Этот городок маленький, но очень удобный.",jp:"この町は小さいですが、とても便利です。"},
  {u:10,t:"まとめ",ru:"Мой старший брат стал директором компании.",jp:"兄は社長になりました。"},
  {u:10,t:"まとめ",ru:"Сколько стоит доехать отсюда до аэропорта?",jp:"ここから空港までいくらかかりますか。"},
  {u:10,t:"まとめ",ru:"По субботам я встаю поздно.",jp:"土曜日は遅く起きます。"},
  {u:10,t:"まとめ",ru:"Я куплю сувениры и привезу их.",jp:"おみやげを買ってきます。"},

  {u:11,t:"〜たり〜たりする",ru:"На выходных занимался, болтал с друзьями и тому подобное.",jp:"週末は、勉強したり、友だちと話したりしました。"},

// общая оболочка карточки: фон, номер урока, появление.
// card.theme — три цвета этой карточки для кнопок.
function makeCard(i, unit) {
  const color = nextColor();
  const card = document.createElement('div');
  card.className = 'card';
  card.style.background = color;
  card.style.animationDelay = `${i * 0.03}s`;
  card.theme = { color, border: darkenHex(color, 22), text: darkenHex(color, 70) };
  if (unit !== undefined) {
    const num = document.createElement('div');
    num.className = 'card-num';
    num.textContent = unit;
    card.appendChild(num);
    card.numEl = num;
  }
  return card;
}

// кнопка карточки: 'mini' — круглая сверху, иначе широкая снизу
function makeButton(kind, label, theme, title) {
  const b = document.createElement('button');
  b.className = kind === 'mini' ? 'kmini' : 'spoiler-btn';
  b.textContent = label;
  if (title) b.title = title;
  paintButtons([b], theme, false);
  return b;
}

// перекрасить кнопки под закрытую (цветную) или открытую (белую) карточку
function paintButtons(btns, theme, open) {
  btns.forEach(b => {
    b.style.borderColor = open ? UI.openBorder : theme.border;
    b.style.color = open ? UI.openText : theme.text;
  });
}

// darken a hex color by a fixed amount for border
function darkenHex(hex, amount) {
  let r = parseInt(hex.slice(1,3),16);
  let g = parseInt(hex.slice(3,5),16);
  let b = parseInt(hex.slice(5,7),16);
  r = Math.max(0, r - amount);
  g = Math.max(0, g - amount);
  b = Math.max(0, b - amount);
  return `rgb(${r},${g},${b})`;
}

const COLORS = ['#BEDDD5','#FCD0BB','#E1E5F3','#FFF0F7'];
let colorPool = [];
function nextColor() {
  if (!colorPool.length) colorPool = [...COLORS].sort(() => Math.random() - 0.5);
  return colorPool.pop();
}

let active = [];
let activeTopics = new Set();
let mode = 'sentence';          // 'sentence' | 'kanji' | 'quiz'
const units = [...new Set(D.map(d => d.u))].sort((a,b) => a - b);
const kanjiUnits = [...new Set(K.map(k => k.u))].sort((a,b) => a - b);

function buildControls() {
  const row = document.getElementById('controlsRow');
  row.innerHTML = '';
  (mode === 'sentence' ? units : kanjiUnits).forEach((u, idx) => {
    const p = document.createElement('button');
    p.className = 'pill';
    p.textContent = idx === 0 ? `第${u}課` : String(u);
    p.onclick = () => {
      const i = active.indexOf(u);
      if (i > -1) { active.splice(i, 1); p.classList.remove('active'); }
      else { active.push(u); p.classList.add('active'); }
      activeTopics.clear();
      buildTopicRow();
      shuffle();
    };
    row.appendChild(p);
  });
}

function buildTopicRow() {
  const row = document.getElementById('topicRow');
  row.innerHTML = '';
  // подтемы есть только у предложений
  if (mode !== 'sentence') return;
  // hide when no unit selected
  if (active.length === 0) return;
  const relevantUnits = active;
  const topics = [...new Set(
    D.filter(d => relevantUnits.includes(d.u)).map(d => d.t)
  )];
  topics.forEach(t => {
    const label = t;
    const p = document.createElement('button');
    p.className = 'topic-pill' + (activeTopics.has(t) ? ' active' : '');
    p.textContent = label;
    p.onclick = () => {
      if (activeTopics.has(t)) {
        activeTopics.delete(t);
        p.classList.remove('active');
      } else {
        activeTopics.add(t);
        p.classList.add('active');
      }
      shuffle();
    };
    row.appendChild(p);
  });
}

function spinIcon(btn) {
  const el = btn.querySelector('.spin');
  el.classList.remove('spinning');
  void el.offsetWidth;
  el.classList.add('spinning');
  el.addEventListener('transitionend', () => {
    el.classList.remove('spinning');
    el.style.transition = 'none';
    el.style.transform = 'rotate(0deg)';
    void el.offsetWidth;
    el.style.transition = '';
  }, { once: true });
}

function shuffle() {
  if (mode === 'kanji') { shuffleKanji(); return; }
  if (mode === 'quiz')  { buildQuiz(); renderQuiz(); return; }
  if (mode === 'learn') { startLearn(); return; }
  const total = UI.deck.sentence;

  if (activeTopics.size > 0) {
    // topic(s) selected: proportional across active topics
    const topics = [...activeTopics];
    const perTopic = Math.floor(total / topics.length);
    const remainder = total - perTopic * topics.length;
    let picked = [];
    topics.forEach((t, idx) => {
      const tp = D.filter(d => d.t === t && d.ru && d.jp &&
                   (active.length === 0 || active.includes(d.u)))
                  .sort(() => Math.random() - 0.5);
      const take = perTopic + (idx < remainder ? 1 : 0);
      picked = picked.concat(tp.slice(0, take));
    });
    picked = picked.sort(() => Math.random() - 0.5);
    colorPool = [];
    render(picked);
    return;
  }

  const selected = active.length === 0 ? units : [...active];
  const perUnit = Math.floor(total / selected.length);
  const remainder = total - perUnit * selected.length;

  let picked = [];
  selected.forEach((u, idx) => {
    const unitPool = D.filter(d => d.u === u && d.ru && d.jp)
                      .sort(() => Math.random() - 0.5);
    const take = perUnit + (idx < remainder ? 1 : 0);
    picked = picked.concat(unitPool.slice(0, take));
  });

  picked = picked.sort(() => Math.random() - 0.5);
  colorPool = [];
  render(picked);
}

function render(items) {
  document.getElementById('ftotal').textContent = UI.footSentences(D.length);
  const grid = document.getElementById('grid');
  grid.className = 'grid';
  grid.innerHTML = '';

  items.forEach((item, i) => {
    const card = makeCard(i, item.u);
    const theme = card.theme;

    const ruEl = document.createElement('div');
    ruEl.className = 'sentence-ru';
    ruEl.textContent = item.ru.replace(/[.。！!？?、,，]$/u, '');

    const answerEl = document.createElement('div');
    answerEl.className = 'answer-text';
    answerEl.textContent = item.jp.replace(/[.。！!？?、,，]$/u, '');

    const btn = makeButton('main', UI.show, theme);

    btn.addEventListener('click', () => {
      const open = !answerEl.classList.contains('visible');
      answerEl.classList.toggle('visible', open);
      btn.textContent = open ? UI.hide : UI.show;
      card.style.background = open ? UI.openBg : theme.color;
      paintButtons([btn], theme, open);
    });

    card.append(ruEl, answerEl, btn);
    grid.appendChild(card);
  });
}

function shuffleKanji() {
  const base = active.length === 0 ? K : K.filter(k => active.includes(k.u));
  const picked = [...base].sort(() => Math.random() - 0.5).slice(0, UI.deck.kanji);
  colorPool = [];

// отрисовка одной черты: трюк с пунктиром — длина штриха равна длине
// пути, сдвиг уезжает от длины к нулю и постепенно открывает линию
function animateOne(p, delay) {
  const len = p.getTotalLength();
  p.style.transition = 'none';
  p.style.strokeDasharray = len;
  p.style.strokeDashoffset = len;
  void p.getBoundingClientRect();
  const dur = Math.max(170, Math.round(len * 6));
  p.style.transition = `stroke-dashoffset ${dur}ms linear ${delay}ms`;
  p.style.strokeDashoffset = 0;
  return dur;
}

// все черты по очереди, в порядке написания
function animateStrokes(svg) {
  let delay = 0;
  [...svg.querySelectorAll('path')].forEach(p => {
    delay += animateOne(p, delay) + 60;
  });
}

// ══════════════════════════════════════════
// ПРОВЕРКА ЧЕРТЫ
// геометрическое сравнение написанного с эталоном KanjiVG.
// Все координаты — в системе самого KanjiVG, 109×109, поэтому
// проверка не зависит от размера поля на экране.
// ══════════════════════════════════════════

const NPTS = 16;                       // на столько точек режем каждую черту
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function polyLen(p) {
  let s = 0;
  for (let i = 1; i < p.length; i++) s += dist(p[i], p[i - 1]);
  return s;
}

// сгладить дрожание пальца скользящим средним по трём точкам
function smooth(pts) {
  if (pts.length < 3) return pts;
  const out = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++) {
    out.push({
      x: (pts[i - 1].x + pts[i].x + pts[i + 1].x) / 3,
      y: (pts[i - 1].y + pts[i].y + pts[i + 1].y) / 3
    });
  }
  out.push(pts[pts.length - 1]);
  return out;
}

// равномерно пересэмплить ломаную в n точек
function resample(pts, n) {
  if (pts.length === 1) return Array.from({length: n}, () => ({x: pts[0].x, y: pts[0].y}));
  const d = [0];
  for (let i = 1; i < pts.length; i++) d.push(d[i - 1] + dist(pts[i], pts[i - 1]));
  const total = d[d.length - 1];
  if (total === 0) return Array.from({length: n}, () => ({x: pts[0].x, y: pts[0].y}));
  const out = [];
  let j = 0;
  for (let i = 0; i < n; i++) {
    const t = total * i / (n - 1);
    while (j < d.length - 2 && d[j + 1] < t) j++;
    const seg = d[j + 1] - d[j];
    const f = seg === 0 ? 0 : (t - d[j]) / seg;
    out.push({
      x: pts[j].x + (pts[j + 1].x - pts[j].x) * f,
      y: pts[j].y + (pts[j + 1].y - pts[j].y) * f
    });
  }
  return out;
}

// эталонная черта: те же NPTS точек, снятые с SVG-пути
function targetPoints(path) {
  const len = path.getTotalLength();
  const out = [];
  for (let i = 0; i < NPTS; i++) {
    const p = path.getPointAtLength(len * i / (NPTS - 1));
    out.push({x: p.x, y: p.y});
  }
  out.len = len;
  return out;
}

function centroid(p) {
  let x = 0, y = 0;
  p.forEach(q => { x += q.x; y += q.y; });
  return {x: x / p.length, y: y / p.length};
}

// Сравнение идёт по четырём признакам:
//   длина, начало, конец — абсолютно (место и направление черты важны),
//   форма — после совмещения по центроиду, чтобы小 сдвиг не штрафовался дважды.
// Допуски масштабируются от длины эталона: у точек и коротких откидных
// они меньше в абсолюте, иначе точку засчитывало бы где угодно.
function checkStroke(user, target) {
  const tlen = target.len;
  const posTol   = clamp(tlen * 0.45, 12, 22);
  const shapeTol = clamp(tlen * 0.35, 9, 18);

  // у коротких черт (точки, мелкие откидные) длина неинформативна —
  // судим их только по месту и форме
  if (tlen >= 14) {
    const ratio = polyLen(user) / tlen;
    if (ratio < 0.40) return {ok: false, why: 'коротко'};
    if (ratio > 2.20) return {ok: false, why: 'длинно'};
  }

  if (dist(user[0], target[0]) > posTol) return {ok: false, why: 'начало'};
  if (dist(user[NPTS - 1], target[NPTS - 1]) > posTol) return {ok: false, why: 'конец'};

  const cu = centroid(user), ct = centroid(target);
  let s = 0;
  for (let i = 0; i < NPTS; i++) {
    s += Math.hypot((user[i].x - cu.x) - (target[i].x - ct.x),
                    (user[i].y - cu.y) - (target[i].y - ct.y));
  }
  const mean = s / NPTS;
  if (mean > shapeTol) return {ok: false, why: 'форма'};
  return {ok: true, score: mean};
}

// ══════════════════════════════════════════
// ПОЛЕ ДЛЯ ПИСЬМА
// ══════════════════════════════════════════

function attachWriter(o) {
  const {card, box, svg, cv, prog, read, mnemo, words, btn, undo, clear, theme} = o;
  const ctx = cv.getContext('2d');
  const paths = [...svg.querySelectorAll('path')];
  const total = paths.length;

  let anyFail = false;      // была ли хоть одна ошибка за этот иероглиф
  let css = 0;              // сторона поля в CSS-пикселях
  let targets = null;       // эталонные точки, считаются один раз при первой черте
  let strokes = [];         // принятые черты
  let cur = null;           // черта в процессе
  let reject = null;        // только что отклонённая — мигает красным
  let idx = 0, fails = 0;
  let drawing = false, done = false, free = false;
  let hintTimer = null;

  const tgt = i => (targets || (targets = paths.map(targetPoints)))[i];

  // ── геометрия и отрисовка ──
  function size() {
    const r = cv.getBoundingClientRect();
    if (!r.width) return;
    css = r.width;
    const dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(r.width * dpr);
    cv.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    redraw();
  }
  requestAnimationFrame(size);

  function drawPoly(pts, color) {
    if (!css) return;
    const k = css / 109;
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 4.5;
    if (pts.length === 1) {
      ctx.beginPath();
      ctx.arc(pts[0].x * k, pts[0].y * k, 2.6, 0, Math.PI * 2);
      ctx.fill();
      return;
    }
    ctx.beginPath();
    ctx.moveTo(pts[0].x * k, pts[0].y * k);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x * k, pts[i].y * k);
    ctx.stroke();
  }

  function redraw() {
    if (!css) return;
    ctx.clearRect(0, 0, css, css);
    strokes.forEach(s => drawPoly(s.pts, s.flash ? UI.right : UI.ink));
    if (cur) drawPoly(cur, UI.ink);
    if (reject) drawPoly(reject, UI.wrong);
  }

  function updateProg() {
    const complete = done || idx >= total;
    prog.classList.toggle('ok', complete);
    if (complete) prog.textContent = UI.strokesDone(total);
    else if (free || idx === 0) prog.textContent = UI.strokesTotal(total);
    else prog.textContent = UI.strokeNow(idx + 1, total);
    undo.disabled = strokes.length === 0;
    // ✕ гасим только когда и правда нечего сбрасывать
    clear.disabled = strokes.length === 0 && !cur && !done && !free;
  }

  // ── состояние карточки ──
  function paint(open) {
    card.style.background = open ? UI.openBg : theme.color;
    paintButtons([btn, undo, clear], theme, open);
  }
  paint(false);

  function revealAll(animate) {
    free = true;
    clearTimeout(hintTimer);
    svg.classList.add('show');
    paths.forEach(p => { p.style.opacity = ''; });
    read.classList.add('visible');
    if (mnemo) mnemo.classList.add('visible');
    words.classList.add('visible');
    btn.textContent = UI.hide;
    paint(true);
    if (animate !== false) animateStrokes(svg);
    updateProg();
  }

  function hideAll() {
    free = false;
    svg.classList.remove('show');
    read.classList.remove('visible');
    if (mnemo) mnemo.classList.remove('visible');
    words.classList.remove('visible');
    btn.textContent = UI.show;
    paint(false);
    updateProg();
  }

  function finish() {
    done = true;
    revealAll(true);
    if (o.onDone) o.onDone(!anyFail);   // режим 覚 ждёт этот сигнал
  }

  // подсказка: показать и прорисовать только ожидаемую черту
  function showHint() {
    if (done || free) return;
    clearTimeout(hintTimer);
    svg.classList.add('show');
    paths.forEach((p, j) => { p.style.opacity = (j === idx ? '1' : '0'); });
    animateOne(paths[idx], 0);
    hintTimer = setTimeout(() => {
      if (free || done) return;
      svg.classList.remove('show');
      paths.forEach(p => { p.style.opacity = ''; });
    }, 1600);
  }

  // ── ввод ──
  const pt = e => {
    const r = cv.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) / r.width * 109,
      y: (e.clientY - r.top) / r.height * 109
    };
  };

  cv.addEventListener('pointerdown', e => {
    if (done || free) return;
    const w = cv.getBoundingClientRect().width;
    if (!css || Math.abs(w - css) > 1) size();
    drawing = true;
    reject = null;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    cur = [pt(e)];
    redraw();
  });

  cv.addEventListener('pointermove', e => {
    if (!drawing || !cur) return;
    cur.push(pt(e));
    redraw();
  });

  function endStroke() {
    if (!drawing || !cur) { drawing = false; return; }
    drawing = false;
    const res = checkStroke(resample(smooth(cur), NPTS), tgt(idx));

    if (res.ok) {
      const s = {pts: cur, flash: true};
      strokes.push(s);
      cur = null;
      fails = 0;
      idx++;
      redraw();
      updateProg();
      setTimeout(() => { s.flash = false; redraw(); }, 260);
      if (idx >= total) setTimeout(finish, 300);
    } else {
      reject = cur;
      cur = null;
      fails++;
      anyFail = true;
      redraw();
      box.classList.remove('shake');
      void box.offsetWidth;
      box.classList.add('shake');
      setTimeout(() => { reject = null; redraw(); }, 420);
      if (fails >= 3) setTimeout(showHint, 440);   // три промаха подряд — подсказываем
    }
  }
  cv.addEventListener('pointerup', endStroke);
  cv.addEventListener('pointercancel', endStroke);

  // ── кнопки ──
  undo.addEventListener('click', () => {
    if (!strokes.length) return;
    if (done) { done = false; hideAll(); }
    strokes.pop();
    idx = Math.max(0, idx - 1);
    fails = 0;
    cur = null;
    reject = null;
    redraw();
    updateProg();
  });

  clear.addEventListener('click', () => {
    strokes = [];
    cur = null;
    reject = null;
    idx = 0;
    fails = 0;
    done = false;
    hideAll();
    redraw();
  });

  btn.addEventListener('click', () => {
    if (svg.classList.contains('show')) {
      if (done) done = false;
      hideAll();
    } else {
      if (!done) anyFail = true;       // подсмотрела — засчитываем как ошибку
      revealAll(true);
      if (!done && o.onDone) { done = true; o.onDone(false); }
    }
  });

  // двойной клик по полю — проиграть порядок черт заново
  box.addEventListener('dblclick', () => {
    if (svg.classList.contains('show')) animateStrokes(svg);
  });

  updateProg();
}

// ══════════════════════════════════════════
// РЕЖИМ ВЫБОРА: собрать слово из кандзи в контексте предложения
// Подсказка только по-русски — японское слово не показываем.
// Пул вариантов — кандзи выбранных уроков плюс всё, что встречается
// в пропусках, то есть заведомо больше четырёх штук.
// ══════════════════════════════════════════

let quiz = {items: [], pool: [], i: 0, wrong: 0, hints: 0,
            bi: 0, filled: [], hint: 0, locked: false};

function buildQuiz() {
  const sents = active.length === 0 ? Q : Q.filter(q => active.includes(q.u));
  const kBase = active.length === 0 ? K : K.filter(k => active.includes(k.u));

  const pool = new Set(kBase.map(k => k.k));
  sents.forEach(q => q.b.forEach(b => [...b[0]].forEach(ch => pool.add(ch))));

  // если для выбранных уроков предложений ещё нет — падаем на отдельные слова
  let items = sents.slice();
  if (!items.length) {
    kBase.forEach(k => k.w.forEach(w => {
      if (w[0].includes(k.k)) {
        items.push({jp: w[0].replace(k.k, '{0}'), ru: w[2],
                    b: [[k.k, w[2], w[1]]]});
      }
    }));
  }

  items = items.sort(() => Math.random() - 0.5).slice(0, UI.deck.quiz);

  quiz = {
    items,
    pool: [...pool],   // все кандзи набора; плитки на каждый вопрос берутся отсюда
    i: 0, wrong: 0, hints: 0, bi: 0, filled: [], hint: 0, locked: false
  };
}

function renderQuiz() {
  const grid = document.getElementById('grid');
  grid.className = 'grid quiz';
  grid.innerHTML = '';
  document.getElementById('ftotal').textContent = UI.footQuiz(quiz.items.length);

  const card = document.createElement('div');
  card.className = 'qcard';
  card.style.background = nextColor();
  grid.appendChild(card);

  // ── всё пройдено ──
  if (quiz.i >= quiz.items.length) {
    const n = quiz.items.length;
    const big = document.createElement('div');
    big.className = 'qprompt';
    big.textContent = UI.score(n, n);
    const sub = document.createElement('div');
    sub.className = 'qsub';
    const bits = [];
    bits.push(quiz.wrong === 0 ? UI.noMistakes : UI.mistakes(quiz.wrong));
    if (quiz.hints) bits.push(UI.hintsUsed(quiz.hints));
    sub.textContent = bits.join(' · ');
    const again = document.createElement('button');
    again.className = 'spoiler-btn qagain';
    again.textContent = UI.again;
    again.onclick = () => { buildQuiz(); renderQuiz(); };
    card.append(big, sub, again);
    return;
  }

  const q = quiz.items[quiz.i];
  quiz.filled = q.b.map(() => '');
  quiz.bi = 0;
  quiz.hint = 0;

  // ── предложение с пропусками ──
  const prompt = document.createElement('div');
  prompt.className = 'qprompt sentence';
  const spans = [];
  q.jp.split(/(\{\d+\})/).forEach(part => {
    const m = part.match(/^\{(\d+)\}$/);
    if (!m) { prompt.append(part); return; }
    const bi = +m[1];
    const span = document.createElement('span');
    span.className = 'blank';
    // ширина пропуска = числу кандзи в слове; сама линия рисуется в CSS,
    // символы ＿ не ставим, иначе получается вторая линия
    span.style.minWidth = q.b[bi][0].length + 'em';
    spans[bi] = span;
    prompt.append(span);
  });

  // ── что вставить, по-русски ──
  const sub = document.createElement('div');
  sub.className = 'qsub';
  const glosses = [];
  q.b.forEach((b, bi) => {
    if (bi) sub.append(' · ');
    const g = document.createElement('span');
    g.textContent = q.b.length > 1 ? `${bi + 1}) ${b[1]}` : b[1];
    glosses[bi] = g;
    sub.append(g);
  });

  const hintBox = document.createElement('div');
  hintBox.className = 'qhint';

  // ── плитки ──
  const pool = document.createElement('div');
  pool.className = 'qpool';
  // У каждого предложения своё поле: нужные кандзи плюс случайные
  // отвлекающие из того же набора уроков, всего UI.deck.pool плиток.
  const need = new Set();
  q.b.forEach(b => [...b[0]].forEach(ch => need.add(ch)));
  const extra = quiz.pool.filter(ch => !need.has(ch)).sort(() => Math.random() - 0.5);
  const tiles = [...need, ...extra].slice(0, Math.max(need.size, UI.deck.pool))
    .sort(() => Math.random() - 0.5);
  tiles.forEach(ch => {
    const t = document.createElement('button');
    t.className = 'qtile';
    t.textContent = ch;
    t.onclick = () => pick(ch, t);
    pool.appendChild(t);
  });

  const hintBtn = document.createElement('button');
  hintBtn.className = 'spoiler-btn qhintbtn';
  hintBtn.textContent = UI.hint;
  hintBtn.onclick = () => {
    if (quiz.hint >= 3) return;
    if (quiz.hint === 0) quiz.hints++;
    quiz.hint++;
    if (quiz.hint >= 3) hintBtn.disabled = true;
    refresh();
  };

  const stat = document.createElement('div');
  stat.className = 'qstat';

  card.append(prompt, sub, hintBox, pool, hintBtn, stat);

  // ── обновление без пересборки карточки ──
  function refresh() {
    q.b.forEach((b, bi) => {
      const need = b[0].length, got = quiz.filled[bi];
      spans[bi].textContent = got;
      spans[bi].classList.toggle('cur', bi === quiz.bi);
      spans[bi].classList.toggle('done', got.length === need);
      glosses[bi].classList.toggle('cur', bi === quiz.bi);
    });
    const cur = q.b[quiz.bi];
    const lines = [];
    if (quiz.hint >= 1) {
      // чтения кандзи, которые уже стоят в предложении
      if (q.f && q.f.length) {
        lines.push(q.f.map(x => `${x[0]}（${x[1]}）`).join('　'));
      }
      lines.push(UI.reading(cur[2]));
    }
    if (quiz.hint >= 2) lines.push(q.ru);
    hintBox.textContent = lines.join('\n');
    const want = quiz.hint >= 3 ? cur[0][quiz.filled[quiz.bi].length] : null;
    [...pool.children].forEach(t => t.classList.toggle('tip', t.textContent === want));
    stat.textContent = UI.score(quiz.i + 1, quiz.items.length) +
                       (quiz.wrong ? ' · ' + UI.mistakes(quiz.wrong) : '');
  }

  function pick(ch, tile) {
    if (quiz.locked) return;
    const want = q.b[quiz.bi][0][quiz.filled[quiz.bi].length];
    if (ch !== want) {
      quiz.wrong++;
      tile.classList.remove('wrong');
      void tile.offsetWidth;
      tile.classList.add('wrong');
      setTimeout(() => tile.classList.remove('wrong'), 450);
      refresh();
      return;
    }
    quiz.filled[quiz.bi] += ch;
    const full = quiz.filled[quiz.bi].length === q.b[quiz.bi][0].length;
    if (full && quiz.bi + 1 < q.b.length) {
      quiz.bi++;
      quiz.hint = 0;
      hintBtn.disabled = false;
      refresh();
      return;
    }
    if (full) {
      // всё собрано — ждём нажатия «далее», сами никуда не прыгаем
      quiz.locked = true;
      refresh();
      spans.forEach(s => s.classList.add('right'));
      hintBox.textContent = q.ru;            // показываем перевод целиком
      hintBtn.disabled = false;
      hintBtn.textContent = UI.next;
      hintBtn.classList.add('qnext');
      hintBtn.onclick = () => {
        quiz.i++;
        quiz.locked = false;
        renderQuiz();
      };
      return;
    }
    refresh();
  }

  refresh();
}

// ══════════════════════════════════════════
// ПРОГРЕСС — что уже сделано и когда показать снова
// Хранится в localStorage этого браузера: на другом устройстве свой.
// ══════════════════════════════════════════

const PROGRESS_KEY = 'shukudai-progress-v1';
const DAY = 86400000;
const STEPS = [1, 3, 7, 16, 35];       // через сколько дней повторить

// Браузер не даёт хранилище локальному файлу (file:// в Chrome, data: везде) —
// тогда прогресс живёт только до закрытия вкладки, и мы об этом честно пишем.
const storageOK = (() => {
  try { localStorage.setItem('_t', '1'); localStorage.removeItem('_t'); return true; }
  catch (e) { return false; }
})();

let progress = (() => {
  try { return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {}; }
  catch (e) { return {}; }
})();

function saveProgress() {
  try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); } catch (e) {}
}

// ok=false сбрасывает интервал в начало: ошиблась — показываем завтра
function markLearned(ch, ok) {
  const p = progress[ch] || {n: 0};
  p.n = ok ? Math.min(p.n + 1, STEPS.length) : 1;
  p.due = Date.now() + STEPS[p.n - 1] * DAY;
  p.seen = Date.now();
  progress[ch] = p;
  saveProgress();
}

const isDue = k => { const p = progress[k.k]; return !p || p.due <= Date.now(); };

// ══════════════════════════════════════════
// РЕЖИМ 覚 — маленький пул, разные типы заданий по кругу
// ══════════════════════════════════════════

let learn = {queue: [], pool: [], total: 0, wrong: 0, bad: null, cur: null, history: []};

// ── недоигранная серия переживает закрытие вкладки (если браузер даёт хранилище) ──
const SESSION_KEY = 'shukudai-session-v1';

function saveSession() {
  if (!learn.queue.length) { try { localStorage.removeItem(SESSION_KEY); } catch (e) {} return; }
  try {
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      pool: learn.pool.map(k => k.k),
      pending: learn.queue.map(t => [t.k.k, t.type]),
      total: learn.total, wrong: learn.wrong, bad: [...learn.bad],
      units: [...active]
    }));
  } catch (e) {}
}

function restoreSession() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(SESSION_KEY)); } catch (e) {}
  if (!s || !s.pending || !s.pending.length) return false;
  if (s.units.join() !== active.join()) return false;        // выбраны другие уроки
  const byChar = ch => K.find(k => k.k === ch);
  const pool = s.pool.map(byChar).filter(Boolean);
  const queue = s.pending.map(([ch, type]) => {
    const k = byChar(ch);
    if (!k) return null;
    return type === 'fill' ? (() => { const src = fillTask(k); return src ? {k, type, src} : null; })()
                           : {k, type};
  }).filter(Boolean);
  if (!pool.length || !queue.length) return false;
  learn = {queue, pool, total: s.total, wrong: s.wrong || 0,
           bad: new Set(s.bad || []), cur: null, history: [], resumed: true};
  return true;
}

function backLearn() {
  if (!learn.history.length) return;
  learn.queue.unshift(learn.history.pop());
  renderLearn();
}

// предложение с пропуском: сперва строка из эпизода, иначе из Q
function fillTask(k) {
  const opts = [];
  E.filter(e => e.u === k.u).forEach(e => e.scenes.forEach(s => {
    if (s.key.includes(k.k) && s.jp.includes(k.k)) opts.push({e, s});
  }));
  if (opts.length) {
    const {e, s} = opts[Math.floor(Math.random() * opts.length)];
    const i = s.jp.indexOf(k.k);
    return {
      jp: s.jp.slice(0, i) + '{0}' + s.jp.slice(i + 1),
      ru: s.ru,
      b: [[k.k, k.mean, (k.kun || k.on).split('・')[0]]],
      f: s.f.filter(x => !x[0].includes(k.k)),
      from: e.title
    };
  }
  const qs = Q.filter(q => q.u === k.u && q.b.some(b => b[0].includes(k.k)));
  return qs.length ? qs[Math.floor(Math.random() * qs.length)] : null;
}

function buildLearn() {
  const base = active.length === 0 ? K : K.filter(k => active.includes(k.u));
  const now = Date.now();
  // сперва то, что пора повторить, потом новое, потом всё остальное
  const pool = [...base].map(k => {
    const p = progress[k.k];
    return {k, rank: !p ? 1 : (p.due <= now ? 0 : 2), due: p ? p.due : 0, r: Math.random()};
  }).sort((a, b) => a.rank - b.rank || a.due - b.due || a.r - b.r)
    .slice(0, UI.deck.learn).map(x => x.k);

  const queue = [];
  pool.forEach(k => {
    if (mainReading(k)) queue.push({k, type: 'kread'});   // у 々 чтения нет
    if (k.w && k.w.length) queue.push({k, type: 'reading'});
    const src = fillTask(k);
    if (src) queue.push({k, type: 'fill', src});
    queue.push({k, type: 'write'});
  });

  learn = {
    queue: queue.sort(() => Math.random() - 0.5),
    pool, total: queue.length, wrong: 0, bad: new Set(), cur: null, history: []
  };
}

// при входе в режим продолжаем недоигранную серию, если она есть
function startLearn() {
  if (!restoreSession()) buildLearn();
  renderLearn();
}

// Все чтения кандзи из таблицы учебника, одним списком.
const allReadings = k => [...(k.on || '').split('・'), ...(k.kun || '').split('・')].filter(Boolean);

// Какое чтение спрашивать. Просто «первое кунное» брать нельзя:
// у 六 кун — むっ, и он живёт только в 六つ, а основное чтение ろく.
// Поэтому берём то чтение, которым кандзи читается в первом слове-примере,
// то есть ровно в том, что подсвечено в 漢字表 этого урока.
function mainReading(k) {
  const all = allReadings(k);
  const w0 = k.w && k.w[0];
  if (w0) {
    if (w0[0] === k.k && w0[1]) return w0[1];              // пример — сам иероглиф
    const hit = all.find(r => w0[1] && w0[1].startsWith(r)); // кандзи в начале слова
    if (hit) return hit;
  }
  return all[0] || '';
}

// случайные варианты-обманки того же вида
function distractors(k, field, n, pool) {
  const mine = field(k);
  const own = new Set(allReadings(k));                      // не предлагать другое чтение того же кандзи
  const rest = (pool || K).filter(x => x.k !== k.k && field(x) &&
                                       field(x) !== mine && !own.has(field(x)))
                .sort(() => Math.random() - 0.5);
  const seen = new Set([mine]);
  const out = [];
  for (const x of rest) {
    if (out.length >= n) break;
    if (seen.has(field(x))) continue;
    seen.add(field(x));
    out.push(field(x));
  }
  return out;
}

function answerLearn(ok) {
  const task = learn.cur;
  if (!task) return;
  if (ok) {
    learn.history.push(learn.queue.shift());      // можно вернуться и посмотреть
  } else {
    learn.wrong++;
    learn.bad.add(task.k.k);
    const t = learn.queue.shift();
    learn.queue.splice(Math.min(3, learn.queue.length), 0, t);   // вернётся позже
  }
  saveSession();
  renderLearn();
}

function renderLearn() {
  const grid = document.getElementById('grid');
  grid.className = 'grid quiz';
  grid.innerHTML = '';
  const left = learn.queue.length;
  document.getElementById('ftotal').textContent = UI.footLearn(left);

  const card = document.createElement('div');
  card.className = 'qcard';
  card.style.background = nextColor();
  grid.appendChild(card);

  // ── заход пройден ──
  if (!left) {
    learn.pool.forEach(k => markLearned(k.k, !learn.bad.has(k.k)));
    saveSession();                       // серия пройдена — забыть недоигранное
    const big = document.createElement('div');
    big.className = 'qprompt';
    big.textContent = UI.learnDone(learn.pool.length);
    const sub = document.createElement('div');
    sub.className = 'qsub';
    sub.textContent = learn.wrong ? UI.mistakes(learn.wrong) : UI.noMistakes;
    const when = document.createElement('div');
    when.className = 'qhint';
    when.textContent = UI.nextReview(learn.pool.map(k => progress[k.k].n)) +
                       (storageOK ? '' : '\n' + UI.noStore);
    const again = document.createElement('button');
    again.className = 'spoiler-btn qagain';
    again.textContent = UI.again;
    again.onclick = () => { buildLearn(); renderLearn(); };
    card.append(big, sub, when, again);
    return;
  }

  const task = learn.queue[0];
  learn.cur = task;
  const k = task.k;

  // кружок «назад» в левом верхнем углу карточки, как иконки справа
  const back = document.createElement('button');
  back.className = 'kmini lback';
  back.textContent = UI.back;
  back.title = UI.backTitle;
  back.disabled = !learn.history.length;
  back.onclick = backLearn;
  card.appendChild(back);

  // счётчик по центру внизу
  const stat = document.createElement('div');
  stat.className = 'qstat';
  const setCounter = () => {
    stat.textContent = UI.learnLeft(learn.total - learn.queue.length + 1, learn.total) +
                       (learn.wrong ? ' · ' + UI.mistakes(learn.wrong) : '');
  };
  setCounter();

  // ── выбор из вариантов: чтение кандзи или чтение слова ──
  if (task.type === 'kread' || task.type === 'reading') {
    const isKanji = task.type === 'kread';
    const word = isKanji ? null : k.w[Math.floor(Math.random() * k.w.length)];
    const right = isKanji ? mainReading(k) : word[1];
    // обманки берём из кандзи тех же уроков, а не из всей базы
    const sameUnits = K.filter(x => x.u === k.u);

    const prompt = document.createElement('div');
    prompt.className = 'qprompt';
    prompt.textContent = isKanji ? k.k : word[0];
    if (isKanji) prompt.style.fontSize = '4rem';

    const sub = document.createElement('div');
    sub.className = 'qsub';
    sub.textContent = UI.pickReading;

    const opts = [right, ...distractors(k, isKanji ? mainReading
                                                   : (x => x.w[0] && x.w[0][1]), 3, sameUnits)]
                   .sort(() => Math.random() - 0.5);
    // у кандзи значение и мнемоника видны сразу — это подсказка, а не вопрос;
    // у слова перевод открывается только после ответа
    const mn = document.createElement('div');
    mn.className = 'qhint';
    mn.textContent = isKanji ? (k.mean + (k.m ? '\n' + k.m : '')) : '';

    const next = document.createElement('button');
    next.className = 'spoiler-btn qnext';
    next.textContent = UI.next;
    next.style.display = 'none';
    next.onclick = () => answerLearn(true);

    const box = document.createElement('div');
    box.className = 'lopts';
    opts.forEach(o => {
      const b = document.createElement('button');
      b.className = 'lopt';
      b.textContent = o;
      b.onclick = () => {
        if (b.disabled || next.style.display === '') return;
        if (o === right) {
          b.classList.add('right');
          box.querySelectorAll('.lopt').forEach(x => { x.disabled = true; });
          mn.textContent = isKanji
            ? (k.mean + (k.m ? '\n' + k.m : ''))
            : `${word[0]}（${word[1]}）— ${word[2]}`;
          next.style.display = '';          // дальше только по кнопке
        } else {
          b.classList.add('wrong');
          b.disabled = true;
          learn.wrong++;
          learn.bad.add(k.k);
          setCounter();
        }
      };
      box.appendChild(b);
    });

    card.append(prompt, sub, box, mn, next, stat);
    return;
  }

  // ── предложение с пропуском (из эпизода или из упражнений) ──
  if (task.type === 'fill') {
    const q = task.src;
    const prompt = document.createElement('div');
    prompt.className = 'qprompt sentence';
    const spans = [];
    q.jp.split(/(\{\d+\})/).forEach(part => {
      const m = part.match(/^\{(\d+)\}$/);
      if (!m) { prompt.append(part); return; }
      const bi = +m[1];
      const span = document.createElement('span');
      span.className = 'blank cur';
      span.style.minWidth = q.b[bi][0].length + 'em';
      spans[bi] = span;
      prompt.append(span);
    });

    const sub = document.createElement('div');
    sub.className = 'qsub';
    sub.textContent = q.b.map(b => b[1]).join(' · ');

    const hint = document.createElement('div');
    hint.className = 'qhint';
    hint.textContent = (task.src.from ? UI.fromStory(task.src.from) + '\n' : '') +
                       (q.f || []).map(x => `${x[0]}（${x[1]}）`).join('　');

    const filled = q.b.map(() => '');
    let bi = 0;
    const need = new Set();
    q.b.forEach(b => [...b[0]].forEach(ch => need.add(ch)));
    const extra = K.filter(x => !need.has(x.k)).sort(() => Math.random() - 0.5)
                   .slice(0, Math.max(0, 12 - need.size)).map(x => x.k);
    const pool = document.createElement('div');
    pool.className = 'qpool';
    [...need, ...extra].sort(() => Math.random() - 0.5).forEach(ch => {
      const t = document.createElement('button');
      t.className = 'qtile';
      t.textContent = ch;
      t.onclick = () => {
        const want = q.b[bi][0][filled[bi].length];
        if (ch !== want) {
          t.classList.remove('wrong'); void t.offsetWidth; t.classList.add('wrong');
          setTimeout(() => t.classList.remove('wrong'), 450);
          learn.wrong++; learn.bad.add(k.k);
          setCounter();
          return;
        }
        filled[bi] += ch;
        spans[bi].textContent = filled[bi];
        if (filled[bi].length === q.b[bi][0].length) {
          spans[bi].classList.remove('cur');
          spans[bi].classList.add('right');
          if (bi + 1 < q.b.length) { bi++; spans[bi].classList.add('cur'); }
          else {
            hint.textContent = q.ru;
            setTimeout(() => answerLearn(true), 650);
          }
        }
      };
      pool.appendChild(t);
    });

    card.append(prompt, sub, hint, pool, stat);
    return;
  }

  // ── написать по чертам ──
  if (task.type === 'write') {
    const head = document.createElement('div');
    head.className = 'kcard-head lhead';
    const mean = document.createElement('span');
    mean.className = 'kmean';
    mean.textContent = k.mean;
    const prog = document.createElement('span');
    prog.className = 'kstrokes';
    prog.textContent = UI.strokesTotal(k.n);
    head.append(mean, prog);

    const box = document.createElement('div');
    box.className = 'kbox lbox';
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 109 109');
    svg.setAttribute('class', 'kghost');
    k.s.forEach(d => {
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', d);
      svg.appendChild(p);
    });
    const cv = document.createElement('canvas');
    cv.className = 'kcanvas';
    box.append(svg, cv);

    const read = document.createElement('div');
    read.className = 'kread visible lread';
    read.textContent = [k.kun, k.on].filter(Boolean).join('・');

    const words = document.createElement('div');
    words.className = 'kwords';

    const theme = {color: card.style.background, border: 'rgba(0,0,0,0.18)', text: 'rgba(0,0,0,0.55)'};
    const btn = makeButton('main', UI.show, theme);
    const undo = makeButton('mini', UI.undo, theme, UI.undoTitle);
    const clear = makeButton('mini', UI.clear, theme, UI.clearTitle);
    const acts = document.createElement('div');
    acts.className = 'kactions lactions';
    acts.append(undo, clear);

    // Карточка сама никуда не перескакивает: написала или подсмотрела —
    // смотри порядок черт сколько нужно, дальше только по кнопке.
    let pendingOk = true;
    const next = document.createElement('button');
    next.className = 'spoiler-btn qnext';
    next.textContent = UI.next;
    next.style.display = 'none';
    next.onclick = () => answerLearn(pendingOk);

    card.append(acts, head, box, read, words, btn, next, stat);

    attachWriter({
      card, box, svg, cv, prog, read, words, btn, undo, clear, theme,
      onDone: ok => {
        pendingOk = ok;
        btn.style.display = 'none';     // ответ уже дан — подсказка больше не нужна
        next.style.display = '';
      }
    });
    return;
  }
}

document.getElementById('modeSwitch').addEventListener('click', e => {
  const b = e.target.closest('.mode-btn');
  if (!b || b.classList.contains('active')) return;
  document.querySelectorAll('.mode-btn').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  mode = b.dataset.mode;
  active = [];
  activeTopics.clear();
  buildControls();
  buildTopicRow();
  shuffle();
});

buildControls();
buildTopicRow();
shuffle();
</script>
